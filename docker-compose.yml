services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - laravel-network

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - laravel-data:/var/lib/mysql
    networks:
      - laravel-network

  # PhpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - laravel-network

  # MailHog Service (for development email testing)
  mailhog:
    image: mailhog/mailhog
    container_name: laravel_mailhog
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP port
      - "8026:8025" # Web UI port
    networks:
      - laravel-network

  # Queue Worker Service (for email notifications)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - mailhog
    networks:
      - laravel-network

  # Selenium Chrome Service (for Laravel Dusk browser testing)
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: laravel_selenium
    restart: unless-stopped
    ports:
      - "4444:4444"  # Selenium WebDriver
      - "7900:7900"  # VNC server for watching tests (password: secret)
    shm_size: 2gb    # Required for Chrome stability
    networks:
      - laravel-network

  # Dusk Service (for running browser tests)
  dusk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_dusk
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=testing
      - APP_URL=http://nginx
      - DUSK_DRIVER_URL=http://selenium:4444
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - app
      - db
      - selenium
      - nginx
    networks:
      - laravel-network
    profiles:
      - testing

networks:
  laravel-network:
    driver: bridge

volumes:
  laravel-data:
    driver: local
